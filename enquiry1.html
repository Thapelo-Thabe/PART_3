<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry Form</title>
</head>
<body>
    <h1>Enquire about Our Services</h1>
    <form action="/process_enquiry" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="enquiry-type">Type of Enquiry:</label>
        <select id="enquiry-type" name="enquiry_type" required>
            <option value="services">Services</option>
            <option value="products">Products</option>
            <option value="volunteer">Volunteer</option>
            <option value="sponsor">Sponsor</option>
        </select><br><br>

        <label for="additional-info">Additional Information:</label><br>
        <textarea id="additional-info" name="additional_info" rows="4" cols="50" placeholder="Please enter your message here..."></textarea><br><br>

        <button type="submit">Submit Enquiry</button>
    </form>
</body>
</html>
